syntax = "proto2";
package dynamic_terrain.classic_msgs;

message TileKey {
  required int32 x = 1;
  required int32 y = 2;
  required int32 z = 3;
}
message Image {
  required uint32 width = 1;
  required uint32 height = 2;
  required bytes rgb = 3;
}
message Mesh {
  required string name = 1;
  required string submesh_name = 2;
  repeated double positions = 3 [packed = true];
  repeated double normals = 4 [packed = true];
  repeated double tex_coords = 5 [packed = true];
  repeated uint32 indices = 6 [packed = true];
}
message Page {
  required TileKey key = 1;
  required uint64 index = 2;
  required string submesh_name = 3;
  required int32 imagery_zoom = 4;
  required int32 texture_size = 5;
  required int32 target_imagery_zoom = 6;
  required Image image = 7;
  required string texture_name = 8;
  optional Mesh mesh = 9;
}
message RenderConfig {
  required int32 warmup_frames = 1;
  required bool lighting = 2;
  required bool cast_shadows = 3;
  required bool receive_shadows = 4;
  required bool frustum_eviction = 5;
  required int32 offscreen_frames = 6;
  required double texture_guard_m = 7;
  repeated string camera_names = 8;
  required bool diagnostics = 9;
}
message Snapshot {
  required uint32 protocol_version = 1;
  required uint64 generation = 2;
  required TileKey center = 3;
  required string resource_prefix = 4;
  repeated Page pages = 5;
  required uint64 estimated_texture_bytes = 6;
  required RenderConfig config = 7;
  repeated int32 geometry_rect = 8 [packed = true];
  repeated double bounds = 9 [packed = true];
  repeated double patch_center = 10 [packed = true];
  required int32 cells_per_tile = 11;
  required int32 cells_x = 12;
  required int32 cells_y = 13;
}
message TextureUpdate {
  required uint32 protocol_version = 1;
  required uint64 generation = 2;
  repeated Page pages = 3;
}

// Manifests carry only identities. Clients request one page at a time, keeping
// each message below 51 MiB even at the maximum 4096 RGB / 128-cell settings.
message PageIdentity {
  required uint64 index = 1;
  required TileKey key = 2;
  required string texture_name = 3;
}
message Manifest {
  required Snapshot metadata = 1;
  required uint64 revision = 2;
  repeated PageIdentity pages = 3;
}
message PageRequest {
  required uint64 generation = 1;
  required uint64 index = 2;
  required bool include_mesh = 3;
}
message PageResponse {
  required uint64 generation = 1;
  required uint64 revision = 2;
  required Page page = 3;
}
